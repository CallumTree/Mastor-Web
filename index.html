<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0F1D" />
    <meta name="color-scheme" content="only dark" />
    <title>Mastor · Job money for contractors</title>
    <meta name="description" content="Scope, site diary, variations, valuations and invoices in one place, for UK contractors and their teams on schedule-of-rates work, from councils and housing associations to the NHS, police, fire and private clients. Fifty founding places: free through the pilot, then half price for as long as you stay." />
    <meta property="og:title" content="Mastor: the master schedule, without the spreadsheets" />
    <meta property="og:description" content="For contractors and their teams on schedule-of-rates work, without a back office: councils, housing associations, NHS, police, fire and private clients. Fifty founding places: free through the pilot, then half price for as long as you stay." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // People already using Mastor skip the front page and go straight to the app: the installed app,
      // anyone signed in on this browser, and sign-in links from emails (their tokens ride on the address).
      // /?site always shows the front page.
      (function () {
        try {
          var l = location, q = l.search, h = l.hash
          if (/[?&]site\b/.test(q)) return
          var fromEmail = /access_token=|refresh_token=|error_description=/.test(h) || /[?&](code|token_hash)=/.test(q)
          var installed = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true
          var signedIn = false
          for (var i = 0; i < localStorage.length; i++) if (/^sb-.+-auth-token$/.test(localStorage.key(i) || '')) { signedIn = true; break }
          if (fromEmail || installed || signedIn) l.replace('/app' + q + h)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/landing/main.tsx"></script>
  </body>
</html>
